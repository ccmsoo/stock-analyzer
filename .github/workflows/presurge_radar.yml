name: 오르기 전 촉매 레이더

"on":
  schedule:
    # 평일 08:00 KST (= 23:00 UTC 전날) — 장 시작 전 촉매 후보 발송
    - cron: '0 23 * * 0-4'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run pre-surge catalyst radar
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # OpenAI 장애 시 폴백 (선택 — 있으면 Claude Haiku로 촉매 평가)
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 토스 키(있으면 차트·유동성 필터 사용, 없으면 graceful)
          TOSS_CLIENT_KEY: ${{ secrets.TOSS_CLIENT_KEY }}
          TOSS_SECRET_KEY: ${{ secrets.TOSS_SECRET_KEY }}
          TZ: Asia/Seoul
        run: python -u -m tools.presurge_radar --telegram --min-score 6 --days 3

      # ── 신호 레이더 (검증된 신호) ─────────────────────────────────────
      # 위 촉매 레이더의 AI 점수는 2026-08-20 대조군 감사에서 **역엣지**로 판정됐다
      # (같은날·같은시장 대비 −2.7%p, t=−6.2 · docs/audit_20260820.md).
      # 아래는 검증된 신호(20일 모멘텀 상위 + 기관 순매수 아님)로 나란히 생성한다.
      # 텔레그램은 아직 위 레이더가 보낸다 — 며칠 비교 후 전환 여부를 결정할 것.
      # 상태 파일(flows)은 /tmp에 받고 커밋하지 않는다 (10MB → 저장소 비대화 방지).
      # 3페이지=60거래일이면 500일 이력과 **완전히 동일한 픽**이 나온다(검증됨).
      - name: 수급 수집 (외인·기관, 약 2분)
        env:
          TZ: Asia/Seoul
        run: python -u -m tools.fetch_flows --pages 3 --tickers 400 --out /tmp/flows_daily.pkl || true

      - name: 신호 레이더
        env:
          TZ: Asia/Seoul
        run: |
          python -u -m tools.signal_radar --flows /tmp/flows_daily.pkl \
            --uni 100 --top 12 --json reports/signal_radar.json \
            || echo "신호 레이더 실패 — 촉매 레이더 결과는 유지"

      - name: Build track record (성적표 JSON — UI /track 데이터)
        env:
          TOSS_CLIENT_KEY: ${{ secrets.TOSS_CLIENT_KEY }}
          TOSS_SECRET_KEY: ${{ secrets.TOSS_SECRET_KEY }}
          TZ: Asia/Seoul
        run: python -u -m tools.build_track_record || echo "track record 실패 — 레이더 결과는 유지"

      - name: Commit radar result if changed
        run: |
          git config user.name "radar-bot"
          git config user.email "radar@stockanalyzer"
          git add reports/presurge_radar.json state/radar_ledger.jsonl reports/track_record.json reports/signal_radar.json || true
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "presurge: $(date -u +%Y%m%d-%H%M)"
            git pull --rebase origin main || true
            git push
          fi
