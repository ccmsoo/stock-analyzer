name: 일일 주식 분석

"on":
  schedule:
    # 평일 KST 15:30 = UTC 06:30
    - cron: '30 6 * * 1-5'
  workflow_dispatch:
    inputs:
      date:
        description: '특정 날짜 (YYYYMMDD, 비우면 최근 영업일)'
        required: false
        default: ''
      top_n:
        description: 'TOP N 종목 (기본 20)'
        required: false
        default: '20'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run daily analysis
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_PROVIDER: ${{ secrets.AI_PROVIDER || 'openai' }}
          TOP_N: ${{ github.event.inputs.top_n || '20' }}
          RUN_DATE: ${{ github.event.inputs.date || '' }}
          TZ: Asia/Seoul
        run: |
          if [ -n "$RUN_DATE" ]; then
            python -u main.py --date "$RUN_DATE" --top "$TOP_N"
          else
            python -u main.py --top "$TOP_N"
          fi

      - name: Refresh reverse signals
        env:
          TZ: Asia/Seoul
        run: python -u -m recommenders.reverse_signal

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.run_id }}
          path: |
            reports/report_*.md
            reports/report_*.html
            reports/report_*.csv
            reports/dashboard.json
            reports/reverse_candidates.json
          retention-days: 30

      - name: Commit and push results
        run: |
          git config user.name "stock-analyzer-bot"
          git config user.email "bot@stockanalyzer"
          git add reports/ state/ || true
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "auto: daily analysis $(date +%Y%m%d)"
            git push
          fi
