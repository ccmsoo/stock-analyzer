name: 레이더 성적표(포워드)

"on":
  schedule:
    # 금요일 16:00 KST (= 07:00 UTC 금) — 장 마감 후 주간 성적표 발송
    - cron: '0 7 * * 5'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Score radar ledger (forward P&L)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TZ: Asia/Seoul
        run: python -u -m tools.score_ledger --telegram
