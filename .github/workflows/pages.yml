name: Publish Reports

"on":
  push:
    branches:
      - main
    paths:
      - "reports/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use assistant home as landing page
        run: |
          if [ -f reports/home.html ]; then
            cp reports/home.html reports/index.html
          fi

      - name: Publish reports to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./reports
          force_orphan: true
